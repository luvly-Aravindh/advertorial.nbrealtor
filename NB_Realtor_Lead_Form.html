<!-- NB Realtors: compact lead form segment. Embed this block on the existing landing page. -->
<section class="nbr-lead" aria-labelledby="nbr-lead-title">
  <style>
    .nbr-lead{--nbr-ink:#28251f;--nbr-gold:#b89151;--nbr-border:#ddd7cd;--nbr-cream:#faf8f3;max-width:520px;margin:24px auto;padding:26px;border:1px solid var(--nbr-border);border-radius:16px;background:var(--nbr-cream);color:var(--nbr-ink);font-family:inherit;box-sizing:border-box}
    .nbr-lead *{box-sizing:border-box}
    .nbr-lead h2{margin:0 0 6px;font-size:clamp(21px,3vw,26px);line-height:1.2;font-weight:700}
    .nbr-lead .nbr-sub{margin:0 0 20px;font-size:14px;line-height:1.5;color:#666055}
    .nbr-lead .nbr-fields{display:grid;gap:13px}
    .nbr-lead label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}
    .nbr-lead input:not([type="hidden"]){display:block;width:100%;height:46px;padding:0 13px;background:#fff;border:1px solid #cec7bc;border-radius:9px;font:inherit;font-size:15px;color:var(--nbr-ink);outline-offset:3px}
    .nbr-lead input:focus{border-color:var(--nbr-gold);outline:2px solid #b8915133}
    .nbr-lead .nbr-phone{display:flex;align-items:center;background:#fff;border:1px solid #cec7bc;border-radius:9px;overflow:hidden}
    .nbr-lead .nbr-phone span{padding:0 12px;white-space:nowrap;font-size:14px;border-right:1px solid #e3ded5;color:#4c463b}
    .nbr-lead .nbr-phone input{border:0!important;border-radius:0!important;outline:none!important}
    .nbr-lead .nbr-phone:focus-within{outline:2px solid #b8915133;border-color:var(--nbr-gold)}
    .nbr-lead button{width:100%;margin-top:18px;min-height:48px;padding:12px 18px;border:0;border-radius:9px;background:var(--nbr-gold);color:#16120b;font:inherit;font-size:15px;font-weight:750;cursor:pointer}
    .nbr-lead button:hover{filter:brightness(.95)}
    .nbr-lead button:focus-visible{outline:3px solid #786033;outline-offset:3px}
    .nbr-lead .nbr-note{font-size:12px;color:#777064;line-height:1.45;text-align:center;margin:12px 0 0}
    .nbr-lead .nbr-status{font-size:13px;margin-top:10px;min-height:1em;color:#a03421}
    /* Honeypot: leave in DOM and accessible to naive bots, but hide from human users */
    .nbr-lead .nbr-trap{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}
    @media(max-width:560px){.nbr-lead{padding:20px 17px;margin:16px auto}}
  </style>

  <h2 id="nbr-lead-title">Speak to a Property Expert</h2>
  <p class="nbr-sub">Share your details and we’ll help with your property enquiry.</p>

  <form id="nbr-lead-form" novalidate>
    <div class="nbr-fields">
      <div>
        <label for="nbr-name">Full name</label>
        <input id="nbr-name" name="full_name" type="text" autocomplete="name" minlength="2" maxlength="80" placeholder="Your name" required>
      </div>
      <div>
        <label for="nbr-email">Email address</label>
        <input id="nbr-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="nbr-phone">Mobile number</label>
        <div class="nbr-phone"><span aria-hidden="true">+91</span><input id="nbr-phone" name="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[6-9][0-9]{9}" placeholder="10-digit mobile number" title="Enter a valid 10-digit Indian mobile number" required></div>
      </div>
    </div>
    <div class="nbr-trap" aria-hidden="true"><label for="nbr-company-site">Company website (leave blank)</label><input id="nbr-company-site" name="company_website" type="text" tabindex="-1" autocomplete="off"></div>
    <button type="submit">Request a Callback</button>
    <p class="nbr-note">We’ll use your contact details only to respond to your enquiry.</p>
    <div class="nbr-status" id="nbr-lead-status" role="status" aria-live="polite"></div>
  </form>

  <script>
    (() => {
      const form = document.getElementById('nbr-lead-form');
      if (!form || form.dataset.nbrBound) return;
      form.dataset.nbrBound = 'true';
      const status = document.getElementById('nbr-lead-status');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        status.textContent = '';
        const name = form.elements.full_name.value.trim();
        const email = form.elements.email.value.trim();
        const mobile = form.elements.mobile.value.replace(/\s/g, '');
        // Silent bot-trap: production endpoint must also reject nonempty company_website.
        if (form.elements.company_website.value.trim()) return;
        if (name.length < 2) { status.textContent = 'Please enter your full name.'; form.elements.full_name.focus(); return; }
        if (!form.elements.email.checkValidity() || !email) { status.textContent = 'Please enter a valid email address.'; form.elements.email.focus(); return; }
        if (!/^[6-9]\d{9}$/.test(mobile)) { status.textContent = 'Please enter a valid 10-digit mobile number.'; form.elements.mobile.focus(); return; }
        // Integration hook: developer must handle this event and submit securely to the CRM/backend.
        // It intentionally does not pretend to save a lead or send an OTP.
        form.dispatchEvent(new CustomEvent('nbr:lead-valid', { bubbles:true, detail:{ full_name:name, email, mobile:'+91'+mobile } }));
        status.textContent = 'Details validated. Submission integration pending.';
      });
    })();
  </script>
</section>
